name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MiniJiraAspire.slnx

      - name: Build
        run: dotnet build src/MiniJiraAspire.slnx --no-restore

      - name: Run Unit Tests
        run: dotnet test src/MiniJira.Test/MiniJira.Test.csproj --no-build --verbosity normal

      - name: Run Integration Tests
        run: dotnet test src/MiniJira.IntegrationTests/MiniJira.IntegrationTests.csproj --no-build --verbosity normal
